{{define "content"}}
<div style="margin-bottom:24px">
  <h1 style="font-size:22px;font-weight:700;margin-bottom:4px">Import Token</h1>
  <p style="color:#64748b;font-size:14px">Manually add an account by pasting tokens</p>
</div>

<div class="card" style="padding:24px;max-width:500px">
  {{if .Error}}
  <div style="background:#991b1b20;color:#f87171;padding:10px;border-radius:8px;font-size:13px;margin-bottom:16px">
    <i class="fas fa-exclamation-circle"></i> {{.Error}}
  </div>
  {{end}}

  <form method="post" action="/accounts/import">
    <div style="margin-bottom:14px">
      <label style="font-size:13px;font-weight:500;color:#94a3b8;display:block;margin-bottom:6px">Account Name</label>
      <input type="text" name="name" placeholder="My Account" value="{{.Name}}">
    </div>
    <div style="margin-bottom:14px">
      <label style="font-size:13px;font-weight:500;color:#94a3b8;display:block;margin-bottom:6px">Access Token</label>
      <input type="text" name="access_token" placeholder="Bearer eyJhbG..." required>
      <div style="font-size:11px;color:#475569;margin-top:4px">Paste the full access token including "Bearer " prefix</div>
    </div>
    <div style="margin-bottom:20px">
      <label style="font-size:13px;font-weight:500;color:#94a3b8;display:block;margin-bottom:6px">Refresh Token (optional)</label>
      <input type="text" name="refresh_token" placeholder="Bearer eyJhbG...">
    </div>
    <div style="display:flex;gap:8px">
      <a href="/accounts" class="btn btn-ghost"><i class="fas fa-times"></i> Cancel</a>
      <button type="submit" class="btn btn-primary" style="flex:1"><i class="fas fa-key"></i> Import</button>
    </div>
  </form>
</div>
{{end}}
